name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall backend frontend tests

      - name: Check environment
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python --version
          python -m pip --version
          python -m pytest --version
          python -c "import os; print('GROQ_API_KEY present:', bool(os.getenv('GROQ_API_KEY')))"
          python -c "import langchain_core; print('langchain-core:', langchain_core.__version__)"
          python -c "import langserve; print('langserve:', langserve.__version__)"
          python -c "import fastapi; print('fastapi:', fastapi.__version__)"
          python -c "import pydantic; print('pydantic:', pydantic.__version__)"

      - name: Run pytest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m pytest -v -s